[package]
name    = "ps5-launcher"
version = "0.1.0"
edition = "2021"

[lib]
name       = "ps5_launcher_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri      = { version = "2", features = [] }
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
dirs       = "5"

[target.'cfg(not(target_os = "macos"))'.dependencies]
hidapi = { version = "2" }
# BT wake handshake — see hid.rs::bt_wake(). Confirmed necessary on real hardware.
crc32fast = "1"

# Windows-only: display mode enumeration/switching (Unit D) + credential storage
# (Unit C, optional). Mouse injection uses a raw extern in mouse_inject.rs, no crate.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Security_Credentials",
    # Audio tab: master volume/mute via IAudioEndpointVolume, per-app mixer
    # via IAudioSessionManager2/ISimpleAudioVolume (all officially documented
    # Core Audio interfaces — unlike default-device switching, which needs an
    # undocumented COM interface and was deliberately skipped; see audio.rs).
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_System_Com",
    # Bluetooth tab: radio on/off + paired device list (WinRT).
    "Devices_Radios",
    "Devices_Bluetooth",
    "Devices_Enumeration",
    "Foundation_Collections",
    "Win32_System_Registry",
    # Real .exe icon extraction (game/launcher tiles).
    "Win32_UI_Shell",
    "Win32_Storage_FileSystem",
] }
# sysinfo (optional, Unit C): "is Discord already running" checks.
sysinfo = "0.31"
# PNG-encode extracted .exe icons (icon_extract.rs). png-only feature set to
# keep the extra binary weight small — no jpeg/webp/etc decoders pulled in.
image = { version = "0.25", default-features = false, features = ["png"] }
base64 = "0.22"
